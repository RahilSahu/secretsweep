[package]
name = "secretsweep"
version = "1.1.0"
edition = "2021"
license = "MIT"
description = "Offline secrets scanner for repositories and CI: provider pattern rules, entropy detection, git history scanning, baselines, JSON and SARIF output."
repository = "https://github.com/RahilSahu/secretsweep"
keywords = ["security", "secrets", "scanner", "devsecops", "ci"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
toml = "0.8"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[profile.release]
lto = true
